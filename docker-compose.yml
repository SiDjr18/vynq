services:
  app:
    build: .
    environment:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "${JWT_SECRET:?Set a unique JWT_SECRET in .env before starting VYNQ}"
      VYNQ_ALLOW_DEMO_ACCOUNTS: "${VYNQ_ALLOW_DEMO_ACCOUNTS:-false}"
      PORT: 4000
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:4000:4000"
    command: sh -c "npm run db:push && npm run start"
